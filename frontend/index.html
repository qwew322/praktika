<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API Tester</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .request-row {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    select,
    input,
    button,
    textarea {
      font: inherit;
    }

    select,
    input,
    button {
      padding: 10px;
    }

    select {
      width: 120px;
    }

    input {
      flex: 1;
    }

    button {
      cursor: pointer;
    }

    textarea {
      width: 100%;
      min-height: 300px;
      box-sizing: border-box;
      padding: 12px;
      font-family: monospace;
      resize: vertical;
    }

    #status {
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <h1>API Tester</h1>

  <div class="request-row">
    <select id="method">
      <option value="GET">GET</option>
      <option value="POST">POST</option>
      <option value="PUT">PUT</option>
      <option value="DELETE">DELETE</option>
    </select>

    <input
      id="endpoint"
      type="text"
      value="/get_some_data"
      placeholder="/get_some_data"
    />

    <button id="sendButton" type="button">Send</button>
  </div>

  <div id="status"></div>

  <textarea
    id="response"
    readonly
    placeholder="Ответ сервера появится здесь..."
  ></textarea>

  <script>
    const methodSelect = document.getElementById("method");
    const endpointInput = document.getElementById("endpoint");
    const sendButton = document.getElementById("sendButton");
    const statusField = document.getElementById("status");
    const responseField = document.getElementById("response");

    sendButton.addEventListener("click", sendRequest);

    async function sendRequest() {
      const method = methodSelect.value;
      let endpoint = endpointInput.value.trim();

      if (!endpoint) {
        responseField.value = "Укажите конечную точку.";
        return;
      }

      if (!endpoint.startsWith("/")) {
        endpoint = "/" + endpoint;
      }

      statusField.textContent = "Отправка запроса...";
      responseField.value = "";

      try {
        const startedAt = performance.now();

        const response = await fetch(endpoint, {
          method: method
        });

        const elapsed = Math.round(performance.now() - startedAt);
        const text = await response.text();

        statusField.textContent =
          `Status: ${response.status} ${response.statusText} | ${elapsed} ms`;

        try {
          const data = JSON.parse(text);
          responseField.value = JSON.stringify(data, null, 2);
        } catch {
          responseField.value = text;
        }
      } catch (error) {
        statusField.textContent = "Ошибка запроса";
        responseField.value = String(error);
      }
    }
  </script>
</body>
</html>
