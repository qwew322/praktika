<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Endpoint Tester</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>API Endpoint Tester</h1>

    <div class="request-row">
        <select id="method">
            <option value="GET">GET</option>
            <option value="POST">POST</option>
            <option value="PUT">PUT</option>
            <option value="DELETE">DELETE</option>
        </select>

        <input id="endpoint" value="/get_category" placeholder="/get_category">
        <button id="sendButton">Send</button>
    </div>

    <label for="request_body">Параметры GET/DELETE или JSON body POST/PUT:</label>
    <textarea id="request_body" placeholder='{"id": 1}'></textarea>

    <div id="status" class="status"></div>
    <textarea id="response" readonly placeholder="Ответ API появится здесь..."></textarea>

    <script src="/static/app.js"></script>
</body>
</html>
